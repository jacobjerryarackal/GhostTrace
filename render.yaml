services:
  - type: web
    name: ghosttrace-backend
    env: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: NEBIUS_BASE_URL
        value: https://api.tokenfactory.nebius.com/v1/
      - key: NEBIUS_MODEL_ID
        value: nvidia/nemotron-3-super-120b-a12b
      - key: NEBIUS_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://ghosttrace.vercel.app,http://localhost:3000

